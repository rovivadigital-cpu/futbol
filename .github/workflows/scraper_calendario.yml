name: Calendario Futbol Diario PRO

on:
  schedule:
    # Se ejecuta cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '5 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar scraper calendario
        run: python futbol_calendario.py

      - name: Guardar datos en repositorio
        if: always()
        run: |
          git config --global user.email "scraperbot@github.com"
          git config --global user.name "TennisScraperBot"

          git add datos/*.csv || true

          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "Update datos: $(date +'%Y-%m-%d %H:%M')"

          git pull --rebase origin main
          git push
