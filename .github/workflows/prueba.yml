name: PonerID
on:
  workflow_dispatch:  # ← agrega esto
  

jobs:
  buscar-y-guardar:
    runs-on: ubuntu-latest
    
    # 1. AGREGA ESTAS DOS LÍNEAS AQUÍ:
    permissions:
      contents: write

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install google-genai

    # Aquí dejamos tu inyección de secreto que ya quedó solucionada
    - name: Ejecutar script de extracción
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python build_equipos_ids.py
      # Paso D: Ejecutar el script inyectando la API KEY
    
    - name: Guardar cambios en el repositorio
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add datos/
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualización automática de datos [skip ci]" && git push)
