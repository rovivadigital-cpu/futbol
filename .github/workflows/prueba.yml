name: Scraping FootyStats España

on:
  schedule:
    - cron: "0 6 * * *"   # Ejecuta cada día a las 6 AM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Descargar CSV de LaLiga (FootyStats)
        run: |
          curl -L "https://footystats.org/download-csv/spain/la-liga" -o laliga.csv

      - name: Guardar resultados en repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add laliga.csv
          git commit -m "Actualizar CSV de LaLiga FootyStats" || echo "No hay cambios"
          git push