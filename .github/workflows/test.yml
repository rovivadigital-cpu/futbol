name: Test WARP
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: IP sin WARP
        run: curl -s -4 ifconfig.me

      - name: Conectar WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          sleep 8
          warp-cli --accept-tos status

      - name: IP con WARP
        run: curl -s -4 ifconfig.me

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar curl_cffi
        run: pip install curl_cffi

      - name: Crear script de prueba
        run: |
          cat > test.py << 'EOF'
          from curl_cffi import requests as cffi_requests

          s = cffi_requests.Session(impersonate="chrome131")
          s.headers.update({
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9,es;q=0.8",
              "Origin": "https://www.sofascore.com",
              "Referer": "https://www.sofascore.com/football",
          })
          r = s.get("https://api.sofascore.com/api/v1/sport/football/scheduled-events/2026-06-08", timeout=30)
          print("STATUS:", r.status_code)
          print(r.text[:300])
          EOF

      - name: Test sofascore
        run: python -u test.py
