name: Test WARP
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: IP sin WARP
        run: curl -s -4 ifconfig.me

      - name: Conectar WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          sleep 8
          warp-cli --accept-tos status

      - name: IP con WARP
        run: curl -s -4 ifconfig.me

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test sofascore
        run: |
          pip install curl_cffi
          python -u test.py

      - name: Guardar datos en repositorio
        if: always()
        run: |
          git config --global user.email "scraperbot@github.com"
          git config --global user.name "TennisScraperBot"
          git add datos/*.csv datos/checkpoint.json || true
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Update datos: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
