name: Cron Calendario Diario Calendario Futbol

on:
  schedule:
    # Se ejecuta todos los días a las 05:00 UTC (Ajusta la hora si lo deseas)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite ejecutar el script manualmente desde la interfaz de GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

     permissions:
       contents: write

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-python: '3.10'
        cache: 'pip' # Optimiza la velocidad de ejecución indexando las descargas

    # 3. Instalar la librería oficial de Google GenAI
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install google-genai

    # 4. Ejecutar el script del calendario pasándole tu API KEY de forma segura
    - name: Ejecutar Script de Calendario
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Reemplaza 'tu_script_calendario.py' por el nombre real de tu archivo python
        python tu_script_calendario.py

    # 5. Guardar los cambios automáticamente en el repositorio (Hot insertion)
    - name: Guardar y subir cambios al repositorio
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Agrega tanto el CSV como el estado de control si se llega a generar
        git add datos/futbol_calendario.csv
        
        # El condicional evita que el flujo falle si no hay partidos nuevos que commitear
        if ! git diff --cached --quiet; then
          git commit -m "⚙️ Actualización automática: Calendario de partidos [Bot]"
          git push
          echo "✅ Cambios subidos al repositorio de manera exitosa."
        else
          echo "o No se detectaron cambios ni partidos nuevos. Nada que actualizar."
        fi
