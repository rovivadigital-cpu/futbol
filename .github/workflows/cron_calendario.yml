name: Cron - Calendario Futbol

on:
  schedule:
    # 4 veces al día: 00:05, 06:05, 12:05, 18:05 UTC
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:
  
jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install google-genai curl_cffi

    - name: Ejecutar Script de Calendario
      env:
        GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
        SOFASCORE_IDS_ACTIVO: "false"
      run: python tu_script_calendario.py

    - name: Guardar y subir cambios al repositorio
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git add datos/calendar_futbol.csv
        [ -f datos/equipos_ids.csv ] && git add datos/equipos_ids.csv

        if ! git diff --cached --quiet; then
          git commit -m "⚙️ Actualización automática: Calendario de partidos [Bot]"
          git push
          echo "✅ Cambios subidos al repositorio de manera exitosa."
        else
          echo "o No se detectaron cambios ni partidos nuevos. Nada que actualizar."
        fi
