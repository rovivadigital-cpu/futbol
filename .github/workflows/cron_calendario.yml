name: Cron - Calendario Futbol

on:
  schedule:
    # Se ejecuta todos los días a las 05:00 UTC (Ajusta la hora si lo deseas)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite ejecutar el script manualmente desde la interfaz de GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. Instalar dependencias
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install google-genai

    # 4. Construir el lookup de IDs de equipos desde el histórico
    - name: Construir lookup de equipos
      run: python build_equipos_ids.py

    # 5. Ejecutar el script del calendario
    - name: Ejecutar Script de Calendario
      env:
        GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      run: python tu_script_calendario.py

    # 6. Guardar los cambios automáticamente en el repositorio
    - name: Guardar y subir cambios al repositorio
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git add datos/calendar_futbol.csv

        if ! git diff --cached --quiet; then
          git commit -m "⚙️ Actualización automática: Calendario de partidos [Bot]"
          git push
          echo "✅ Cambios subidos al repositorio de manera exitosa."
        else
          echo "o No se detectaron cambios ni partidos nuevos. Nada que actualizar."
        fi
